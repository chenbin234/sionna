<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 600 430"><title id="title">Antenna array geometry</title><desc id="desc">Single panel of three rows by four columns of dual-polarized antenna elements in the local y-z plane, with the element spacing parameters annotated.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#333" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><text x="300" y="30" fill="#333" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">AntennaArray geometry</text><rect width="258" height="188" x="126" y="96" fill="#f7f7f7" stroke="#222" stroke-dasharray="7 5" stroke-width="2" rx="8"/><g stroke="#c21f30" stroke-linecap="round" stroke-width="3"><line x1="142" x2="158" y1="112" y2="128"/><line x1="158" x2="142" y1="112" y2="128"/><line x1="212" x2="228" y1="112" y2="128"/><line x1="228" x2="212" y1="112" y2="128"/><line x1="282" x2="298" y1="112" y2="128"/><line x1="298" x2="282" y1="112" y2="128"/><line x1="352" x2="368" y1="112" y2="128"/><line x1="368" x2="352" y1="112" y2="128"/><line x1="142" x2="158" y1="182" y2="198"/><line x1="158" x2="142" y1="182" y2="198"/><line x1="212" x2="228" y1="182" y2="198"/><line x1="228" x2="212" y1="182" y2="198"/><line x1="282" x2="298" y1="182" y2="198"/><line x1="298" x2="282" y1="182" y2="198"/><line x1="352" x2="368" y1="182" y2="198"/><line x1="368" x2="352" y1="182" y2="198"/><line x1="142" x2="158" y1="252" y2="268"/><line x1="158" x2="142" y1="252" y2="268"/><line x1="212" x2="228" y1="252" y2="268"/><line x1="228" x2="212" y1="252" y2="268"/><line x1="282" x2="298" y1="252" y2="268"/><line x1="298" x2="282" y1="252" y2="268"/><line x1="352" x2="368" y1="252" y2="268"/><line x1="368" x2="352" y1="252" y2="268"/></g><g stroke="#bbb" stroke-width="1"><line x1="150" x2="150" y1="66" y2="106"/><line x1="220" x2="220" y1="66" y2="106"/><line x1="96" x2="134" y1="120" y2="120"/><line x1="96" x2="134" y1="190" y2="190"/></g><g stroke="#333" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"><line x1="150" x2="220" y1="70" y2="70"/><line x1="100" x2="100" y1="120" y2="190"/><line x1="130" x2="380" y1="302" y2="302"/><line x1="400" x2="400" y1="100" y2="280"/></g><g fill="#333" font-family="DejaVu Serif, Times New Roman, serif" font-size="18" font-style="italic"><text x="185" y="60" text-anchor="middle">d<tspan dy="4" font-size="12" font-style="normal">H</tspan></text><text x="84" y="155" text-anchor="middle" transform="rotate(-90 84 155)">d<tspan dy="4" font-size="12" font-style="normal">V</tspan></text></g><g fill="#333" font-family="DejaVu Sans, Arial, sans-serif" font-size="16"><text x="255" y="326" text-anchor="middle">num_cols = 4</text><text x="422" y="190" text-anchor="middle" transform="rotate(-90 422 190)">num_rows = 3</text><text x="255" y="364" fill="#666" font-size="15" text-anchor="middle">single panel centered on the origin</text></g><g stroke="#333" stroke-width="2" marker-end="url(#arrow)"><line x1="492" x2="562" y1="392" y2="392"/><line x1="492" x2="492" y1="392" y2="322"/></g><circle cx="492" cy="392" r="4" fill="#333"/><g fill="#333" font-family="DejaVu Serif, Times New Roman, serif" font-size="18"><text x="570" y="397"><tspan>+</tspan><tspan font-style="italic">y</tspan></text><text x="492" y="312" text-anchor="middle"><tspan>+</tspan><tspan font-style="italic">z</tspan></text></g></svg>