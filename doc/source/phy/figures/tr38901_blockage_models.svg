<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" role="img" viewBox="0 0 1200 520"><title id="title">TR 38.901 blockage models A and B</title><desc id="description">Model A uses angular blocking regions around a user terminal. Model B uses explicitly positioned rectangular screens. Both attenuate line-of-sight and individual multipath rays.</desc><defs><marker id="arrow-dark" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#263442" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#bd3f4b" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1200" height="520" fill="#fff"/><rect width="556" height="405" x="24" y="24" fill="#f8fafc" stroke="#c7d0d9" stroke-width="2" rx="6"/><rect width="556" height="405" x="620" y="24" fill="#f8fafc" stroke="#c7d0d9" stroke-width="2" rx="6"/><text x="52" y="62" fill="#263442" font-family="sans-serif" font-size="24" font-weight="700">MODEL A</text><text x="52" y="88" fill="#536273" font-family="sans-serif" font-size="16">Stochastic angular regions around each UT</text><circle cx="305" cy="255" r="132" fill="none" stroke="#aeb9c4" stroke-dasharray="7 7" stroke-width="2"/><path fill="#bd3f4b" fill-opacity=".2" stroke="#bd3f4b" stroke-width="2" d="M 305 255 L 184 309 A 132 132 0 0 1 173 228 Z"/><path fill="#d39a24" fill-opacity=".24" stroke="#bd8114" stroke-width="2" d="M 305 255 L 357 134 A 132 132 0 0 1 423 198 Z"/><line x1="92" x2="296" y1="125" y2="249" stroke="#177da8" stroke-width="3" marker-end="url(#arrow-dark)"/><line x1="492" x2="314" y1="119" y2="247" stroke="#177da8" stroke-width="3" marker-end="url(#arrow-dark)"/><line x1="96" x2="294" y1="357" y2="263" stroke="#bd3f4b" stroke-dasharray="8 6" stroke-width="3" marker-end="url(#arrow-red)"/><g fill="none" stroke="#263442" stroke-width="3"><line x1="92" x2="92" y1="104" y2="144"/><line x1="78" x2="106" y1="144" y2="144"/><line x1="82" x2="102" y1="116" y2="116"/><line x1="492" x2="492" y1="98" y2="138"/><line x1="478" x2="506" y1="138" y2="138"/><line x1="482" x2="502" y1="110" y2="110"/></g><rect width="36" height="34" x="287" y="238" fill="#263442" rx="5"/><circle cx="305" cy="246" r="5" fill="#fff"/><text x="292" y="294" fill="#263442" font-family="sans-serif" font-size="16" font-weight="700">UT</text><line x1="160" x2="207" y1="340" y2="307" stroke="#bd3f4b" stroke-width="2"/><text x="55" y="367" fill="#9d2f3a" font-family="sans-serif" font-size="15" font-weight="600">self-blocking region</text><line x1="445" x2="397" y1="156" y2="170" stroke="#bd8114" stroke-width="2"/><text x="245" y="111" fill="#94640f" font-family="sans-serif" font-size="15" font-weight="600">sampled non-self blocker</text><text x="167" y="404" fill="#536273" font-family="sans-serif" font-size="15">arrival direction selects the loss</text><text x="648" y="62" fill="#263442" font-family="sans-serif" font-size="24" font-weight="700">MODEL B</text><text x="648" y="88" fill="#536273" font-family="sans-serif" font-size="16">Explicit rectangular screens in the scene</text><line x1="661" x2="1138" y1="353" y2="353" stroke="#98a6b4" stroke-width="2"/><g fill="none" stroke="#263442" stroke-width="4"><line x1="700" x2="700" y1="132" y2="353"/><line x1="680" x2="720" y1="353" y2="353"/><line x1="682" x2="718" y1="180" y2="180"/><line x1="687" x2="713" y1="156" y2="156"/></g><text x="672" y="120" fill="#263442" font-family="sans-serif" font-size="16" font-weight="700">BS</text><polygon fill="#bd3f4b" fill-opacity=".28" stroke="#bd3f4b" stroke-width="3" points="865 184 906 168 906 353 865 353"/><circle cx="1090" cy="326" r="15" fill="#263442"/><line x1="1090" x2="1090" y1="341" y2="353" stroke="#263442" stroke-width="4"/><text x="1077" y="306" fill="#263442" font-family="sans-serif" font-size="16" font-weight="700">UT</text><line x1="700" x2="1090" y1="156" y2="326" stroke="#bd3f4b" stroke-width="4" marker-end="url(#arrow-red)"/><polyline fill="none" stroke="#177da8" stroke-width="3" marker-end="url(#arrow-dark)" points="700 156 822 112 1090 326"/><polyline fill="none" stroke="#2f855a" stroke-width="3" marker-end="url(#arrow-dark)" points="700 156 1000 116 1090 326"/><line x1="838" x2="838" y1="184" y2="353" stroke="#bd3f4b" stroke-width="2" marker-end="url(#arrow-red)" marker-start="url(#arrow-red)"/><text x="790" y="273" fill="#9d2f3a" font-family="sans-serif" font-size="15" font-weight="600" transform="rotate(-90 790 273)">height</text><line x1="868" x2="905" y1="378" y2="378" stroke="#bd3f4b" stroke-width="2" marker-end="url(#arrow-red)" marker-start="url(#arrow-red)"/><text x="866" y="398" fill="#9d2f3a" font-family="sans-serif" font-size="15" font-weight="600">width</text><text x="921" y="196" fill="#9d2f3a" font-family="sans-serif" font-size="15" font-weight="600">screen center and orientation</text><text x="719" y="422" fill="#536273" font-family="sans-serif" font-size="15">path-screen geometry determines the loss</text><rect width="1152" height="49" x="24" y="449" fill="#eef2f5" stroke="#c7d0d9" stroke-width="2" rx="6"/><text x="600" y="480" fill="#263442" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">Output: additional attenuation for LOS and for every generated ray</text></svg>